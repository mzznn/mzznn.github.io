---
layout: default
---

<div class="posts">
  {% for post in paginator.posts %}
  <article class="post">
  <span style="color: #333333; font-weight: normal; text-transform: uppercase; font-size: smaller;">&nbsp;{{ post.date | date: "%B %e, %Y" }}</span> <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a> • <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read more&nbsp;&#183;{% include read-time.html content=post.content %}</a>
  </article>
  {% endfor %}

  {% include pagination.html %}
</div>
